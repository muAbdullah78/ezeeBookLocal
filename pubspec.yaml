name: ezeebook
description: "EzeeBook - Tailor Shop Management App"
publish_to: 'none'
# Bump BOTH the name and the build number for every build handed to a shop, and
# keep `kAppVersion` in lib/core/constants/app_constants.dart in step. Android
# compares the build number to decide whether an install is an update, and the
# name is what Settings → About shows the tailor, so it is how you know which
# shop is running what.
version: 2.2.0+9

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Material/Cupertino strings and date formats for non-English locales.
  # Required for Urdu: without it, switching locale throws "No
  # MaterialLocalizations found" the first time a date picker opens.
  flutter_localizations:
    sdk: flutter

  # Local Database (offline-first, single source of truth)
  sqflite: ^2.4.1
  path: ^1.9.0

  # Internationalization (English + Urdu)
  easy_localization: ^3.0.7

  # WhatsApp & URLs
  url_launcher: ^6.3.1

  # Utilities
  intl: 0.20.2
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.4
  sqflite_common_ffi: ^2.4.0+2
  speech_to_text: ^7.3.0
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  flutter_native_splash: ^2.4.7

  # Local backup/restore file picking (device migration)
  file_picker: ^8.1.2

  # PIN hashing for the optional offline app-lock
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - lib/l10n/

  fonts:
    # Urdu face for the whole app AND the PDF receipt.
    #
    # This was Noto Nastaliq. Nastaliq is beautiful for print but wrong here for
    # two concrete reasons: it has none of the 141 Arabic Presentation Forms-B
    # codepoints (U+FE70-FEFF) that the `pdf` package's Arabic shaper emits, so
    # every Urdu word on a receipt came out as scattered dots; and as a
    # calligraphic display face it reads as heavy and cramped at UI sizes.
    # Noto Naskh Arabic covers those forms, covers Latin as well, and is a text
    # face meant to be read small.
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
        - asset: assets/fonts/NotoNaskhArabic-Bold.ttf
          weight: 700